services:
  cbuild:
    build: .
    image: cbuild-service:latest
    ports:
      - "8000:8000"
    environment:
      CACHE_DIR: /cache/objects
      DEBUG_CACHE_DIR: /cache/objects-debug
      SYMBOLS_DIR: /cache/symbols
      WORK_DIR: /tmp/cbuild-work
    volumes:
      # Object caches and the Build-ID symbol store survive container restarts.
      - cbuild-cache:/cache
    restart: unless-stopped

volumes:
  cbuild-cache:
